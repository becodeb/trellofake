services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-file:/app/data/prod.db}
      - STORAGE_DIR=${STORAGE_DIR:-/app/storage}
      - TEAM_SLUG=${TEAM_SLUG:-hilo}
    volumes:
      - hilo-data:/app/data
      - hilo-storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  hilo-data:
  hilo-storage: