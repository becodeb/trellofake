name: hilo

services:
  app:
    build: .
    container_name: hilo-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dev.db
      STORAGE_DIR: /app/storage
    volumes:
      - hilo-data:/app/data
      - hilo-storage:/app/storage
    command: ["npx", "next", "start", "-H", "0.0.0.0"]

volumes:
  hilo-data:
  hilo-storage: